# Продакшен на одном сервере: docker compose -f compose.prod.yml up -d --build
# Настройки — в файле .env рядом (шаблон: .env.production.example). Инструкция: docs/DEPLOY.md.

# Один образ на сайт, воркер и миграции; собирает его сервис app.
x-app: &app
  image: lidd-crm:latest
  pull_policy: never
  env_file: ${ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql://lidd:${DB_PASSWORD:?задайте DB_PASSWORD в .env}@db:5432/lidd_crm
    AUTH_TRUST_HOST: "true"
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lidd
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lidd_crm
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lidd -d lidd_crm"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Порт наружу не открываем: база доступна только контейнерам.

  # Миграции перед запуском новой версии (одноразовый контейнер).
  migrate:
    <<: *app
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  app:
    <<: *app
    build: .
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["npm", "run", "worker:prod"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  # Ночные копии базы: локально (./backups) и в S3-хранилище, если задано.
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      PGHOST: db
      PGUSER: lidd
      PGDATABASE: lidd_crm
      PGPASSWORD: ${DB_PASSWORD}
      TZ: Asia/Vladivostok
    volumes:
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
